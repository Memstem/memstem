# Memstem recall-quality eval queries — EXAMPLE SET.
#
# This file shows the shape of an eval set; it is not a set you can run
# against your own vault and expect hits. Every name, host, number and
# date below is invented (example.com, 555-01xx numbers, port 12345,
# "Acme", "Northwind"). A real eval set names your own hosts, people and
# projects, so keep it outside the repo — e.g. copy this file to
# `<vault>/_meta/eval/queries.yaml`, replace the queries with questions
# your vault can actually answer, and run:
#
#   scripts/run_eval.py --queries <vault>/_meta/eval/queries.yaml
#
# Schema (see `src/memstem/eval/harness.py` for the full reference):
#
#   queries:
#     - id: <unique-id>
#       class: factual | conceptual | procedural | historical | current
#       query: <natural-language query>
#       expect:
#         title_contains: ["substr1", "substr2", ...]   # logical OR
#         body_contains:  ["substr1", "substr2", ...]   # logical OR
#         path_contains:  ["substr1", "substr2", ...]   # logical OR
#       top_k: 10                                       # optional
#
# A result matches if ANY listed substring (case-insensitive) appears in
# ANY listed field. Substrings are robust to dedup / rephrasing because
# they don't tie to a specific memory_id.
#
# How to write a good query:
#   - Phrase the query the way you would actually ask it, and avoid
#     copying the expected substring into the query, so a plain keyword
#     match can't score a hit on its own.
#   - Pick expected substrings that only appear in the memory you want
#     (a port number, a script name, a date), and list a few variants
#     (e.g. both phone formats) so harmless rewording still matches.
#   - Cover all four classes; the per-class breakdown shows which kind
#     of recall a change helped or hurt.
#
# Starter shape: 12 queries across 4 classes plus 4 project-grain
# queries. Grow this as new failure modes surface. Edit freely — this is
# a working eval set, not a regression-test contract.

queries:
  # ─── FACTUAL ──────────────────────────────────────────────────────────
  - id: factual_assistant_port
    class: factual
    query: what gateway port does the assistant run on
    expect:
      body_contains: ["12345"]

  - id: factual_owner_phone
    class: factual
    query: what is the office phone number
    expect:
      body_contains: ["(202) 555-0142", "202-555-0142"]

  - id: factual_deliverables_folder
    class: factual
    query: shared drive folder ID for final deliverables
    expect:
      body_contains: ["example-folder-id-0001", "Deliverables"]

  - id: factual_website_ssh
    class: factual
    query: SSH host for the company website
    expect:
      body_contains: ["acme-web", "web-01.example.com"]

  # ─── CONCEPTUAL ──────────────────────────────────────────────────────
  - id: conceptual_memory_architecture
    class: conceptual
    query: assistant memory architecture overview
    expect:
      title_contains: ["Memory Architecture"]
      path_contains: ["memory-architecture"]

  - id: conceptual_dedup_pipeline
    class: conceptual
    query: how does Memstem dedup work
    expect:
      title_contains: ["dedup", "LLM-as-judge", "duplication"]
      path_contains: ["0012-llm-judge-dedup", "dedup"]

  - id: conceptual_backup_rotation
    class: conceptual
    query: how the nightly backup rotation keeps daily weekly and monthly copies
    expect:
      body_contains: ["grandfather-father-son", "daily copies", "weekly copies"]

  # ─── PROCEDURAL ──────────────────────────────────────────────────────
  - id: procedural_send_chat_alert
    class: procedural
    query: how do I send a chat notification to the on-call person
    expect:
      body_contains: ["notify-send.sh", "scripts/notify-send.sh"]

  - id: procedural_deploy_website
    class: procedural
    query: how do I deploy the company website
    expect:
      body_contains: ["acme-site/deploy.sh", "deploy.sh"]

  - id: procedural_send_email
    class: procedural
    query: how do I send an email as the assistant
    expect:
      body_contains: ["send_mail.py", "EmailMessage"]

  # ─── HISTORICAL ──────────────────────────────────────────────────────
  - id: historical_wiki_migration
    class: historical
    query: when did we move the team notes into the wiki
    expect:
      body_contains: ["2025-01-15", "Wiki Migration"]

  - id: historical_vector_backfill
    class: historical
    query: when was the vector store backfill done
    expect:
      body_contains: ["2025-02-20", "Vector Store Backfill", "1,234"]

  # ─── PROJECT-GRAIN (W8/W9: distillation + project records) ──────────
  # These queries exercise the recall failure mode that motivated ADRs
  # 0020/0021: natural-language searches for project work (entities,
  # deliverables, "the project where we did X") should land on a
  # type=project or type=distillation record, not a raw session JSONL.
  # Until `memstem hygiene distill-sessions --backfill --apply` and
  # `memstem hygiene project-records --apply` have run on the live
  # vault, these queries report the baseline (raw transcripts surface
  # weakly or not at all). After running both commands, the same
  # queries should land on shape-optimized records — that lift is the
  # eval gate for flipping any default-on knobs.
  #
  # "Northwind" is a placeholder project: replace the substrings with
  # terms from your actual project records. The structure is what
  # matters, not the specific entity.

  - id: project_northwind_walkthrough_video
    class: conceptual
    query: Northwind Logistics warehouse walkthrough video
    expect:
      title_contains: ["Northwind"]
      body_contains: ["Northwind", "walkthrough"]
      path_contains: ["projects/home-user-northwind", "distillations"]

  - id: project_aerial_demo_revision
    class: conceptual
    query: the project where we revised the aerial-style demo video
    expect:
      body_contains: ["aerial", "demo", "revision", "video"]
      path_contains: ["projects/", "distillations"]

  - id: project_recent_client_work
    class: conceptual
    query: what did we build for the client last week
    expect:
      title_contains: ["Project"]
      path_contains: ["projects/"]

  - id: project_distillation_ranks_above_raw
    class: conceptual
    query: Northwind forklift & loading dock tracking proposal
    expect:
      # A distillation or project record (path under
      # `distillations/` or `memories/projects/`) should outrank the
      # raw session JSONL at `sessions/<id>.md`. The ranking is what
      # we care about; substring matching just confirms shape.
      path_contains: ["distillations/", "memories/projects/"]
